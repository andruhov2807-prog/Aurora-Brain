name: Build Aurora APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456"
      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git engine
      - name: Apply Aurora overlay
        run: |
          unzip -o aurora-overlay.zip -d overlay
          cp -R overlay/app/. engine/examples/llama.android/app/
      - name: Build arm64 debug APK
        working-directory: engine/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Brain-APK
          path: engine/examples/llama.android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
